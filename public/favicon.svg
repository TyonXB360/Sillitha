<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#070A10" stroke="#00F0FF" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Central node & spider lattice -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke="#A855F7" stroke-width="1.5" fill="none" opacity="0.5"/>
  <line x1="50" y1="15" x2="50" y2="85" stroke="#00F0FF" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="32" x2="80" y2="68" stroke="#00F0FF" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="68" x2="80" y2="32" stroke="#00F0FF" stroke-width="1.5" opacity="0.4"/>
  <!-- Glowing core -->
  <circle cx="50" cy="50" r="12" fill="url(#grad)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="5" fill="#FFFFFF"/>
  <circle cx="50" cy="15" r="4" fill="#00F0FF"/>
  <circle cx="80" cy="32" r="4" fill="#A855F7"/>
  <circle cx="80" cy="68" r="4" fill="#F59E0B"/>
  <circle cx="50" cy="85" r="4" fill="#10B981"/>
  <circle cx="20" cy="68" r="4" fill="#F43F5E"/>
  <circle cx="20" cy="32" r="4" fill="#3B82F6"/>
</svg>